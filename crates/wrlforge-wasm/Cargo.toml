[package]
name = "wrlforge-wasm"
description = "WRL Forge RUST-1 WebAssembly boundary over wrlforge-text. Isolated; no production caller."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wrlforge-text = { path = "../wrlforge-text" }
# Owner-approved for RUST-1 (D4). Exact pins; see docs/architecture/RUST_1_BOUNDARY_CONTRACT.md.
wasm-bindgen = { version = "=0.2.129", default-features = false, features = ["std"] }
js-sys = { version = "=0.3.106", default-features = false }

[features]
# NEGATIVE CONTROLS ONLY. Each feature re-introduces one known defect so the
# differential harness can prove it detects that defect. The release artifact is
# built with no features; spikes/rust-1-wasm-boundary/build.mjs asserts that.
negative-control-utf8-tiebreak = ["wrlforge-text/negative-control-utf8-tiebreak"]
negative-control-no-ambiguity = ["wrlforge-text/negative-control-no-ambiguity"]
negative-control-no-boundary = ["wrlforge-text/negative-control-no-boundary"]
negative-control-lossy-utf16 = []

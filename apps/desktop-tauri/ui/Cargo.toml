[package]
name = "wrlforge-ui"
description = "WRL Forge desktop UI: Leptos (CSR) compiled to WebAssembly. Holds no document authority."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# Pinned to the wasm-bindgen-cli installed under target/tools (build-ui.sh).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1"
wrlforge-desktop-protocol = { path = "../protocol" }

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlTextAreaElement",
  "HtmlInputElement", "HtmlSelectElement", "NodeList",
  "Event", "EventInit", "EventTarget", "InputEvent", "InputEventInit", "KeyboardEvent", "KeyboardEventInit",
  "Performance", "console", "DomRect", "CssStyleDeclaration",
]

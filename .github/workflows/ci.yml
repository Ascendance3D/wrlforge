name: CI

# Non-visual continuous integration for WRL Forge.
# Runs the node test suite, the syntax/check gate, deterministic icon
# generation, product-posture checks, and packaging-config validation on Ubuntu,
# Windows, and macOS. It deliberately does NOT launch any Electron visual QA
# suite -- those run one process at a time under the sanctioned VisualQaRunner
# locally, never concurrently in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; cancel superseded runs so we never stack Electron-adjacent work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Pushes to main run on the self-hosted Proxmox runners (public-ci runner
    # group, restricted to this repo). Pull requests always use GitHub-hosted
    # runners so fork code never executes on the self-hosted machines. There is
    # no self-hosted macOS runner, so macOS is GitHub-hosted either way.
    runs-on: ${{ github.event_name == 'pull_request' && matrix.hosted || fromJSON(matrix.self_hosted) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            hosted: ubuntu-latest
            self_hosted: '["self-hosted", "linux-proxmox"]'
          - os: windows
            hosted: windows-latest
            self_hosted: '["self-hosted", "windows-proxmox"]'
          - os: macos
            hosted: macos-latest
            self_hosted: '"macos-latest"'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run build:icons

      - name: Verify icon generation is deterministic
        run: git diff --exit-code -- assets/generated/icons
        shell: bash

      - name: Bundle native editor
        run: npm run build:editor

      - name: Tests + syntax/check gate (includes product-posture)
        run: npm run check

      - name: Validate packaging configuration
        shell: bash
        run: node .github/scripts/validate-build-config.js

name: CI

# Linux-first product phase. The check name stays stable for branch rules.
# Documentation-only pull requests use a quick gate without npm builds.
# This workflow does not prove native Rust/Tauri or GUI readiness.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu)
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux-proxmox"]') }}
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify PR changes
        id: scope
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Main push or manual run: full Linux checks."
            exit 0
          fi
          if ! git rev-parse --verify 'HEAD^1' >/dev/null 2>&1 ||
             ! git rev-parse --verify 'HEAD^2' >/dev/null 2>&1; then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Unable to compare both PR parents: run full checks."
            exit 0
          fi
          mapfile -d '' changed < <(git diff --name-only -z 'HEAD^1' 'HEAD^2')
          if (( ${#changed[@]} == 0 )); then
            echo "run_full=true" >> "$GITHUB_OUTPUT"
            echo "Empty PR diff: run full checks."
            exit 0
          fi
          for file in "${changed[@]}"; do
            case "$file" in
              *.md) ;;
              *)
                echo "run_full=true" >> "$GITHUB_OUTPUT"
                echo "Non-Markdown change: run full checks."
                exit 0
                ;;
            esac
          done
          echo "run_full=false" >> "$GITHUB_OUTPUT"
          echo "Markdown-only change: skip npm build and check."

      - name: Set up Node.js
        if: steps.scope.outputs.run_full == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.run_full == 'true'
        run: npm ci

      - name: Generate icons
        if: steps.scope.outputs.run_full == 'true'
        run: npm run build:icons

      - name: Verify icon generation is deterministic
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: |
          git rev-parse --is-inside-work-tree
          git diff --exit-code -- assets/generated/icons

      - name: Bundle native editor
        if: steps.scope.outputs.run_full == 'true'
        run: npm run build:editor

      - name: Tests + syntax/check gate (includes product-posture)
        if: steps.scope.outputs.run_full == 'true'
        run: npm run check

      - name: Validate packaging configuration
        if: steps.scope.outputs.run_full == 'true'
        shell: bash
        run: node .github/scripts/validate-build-config.js

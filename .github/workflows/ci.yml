name: CI

# Non-visual continuous integration for WRL Forge.
# Runs the node test suite, the syntax/check gate, deterministic icon
# generation, product-posture checks, and packaging-config validation on Ubuntu,
# Windows, and macOS. It deliberately does NOT launch any Electron visual QA
# suite -- those run one process at a time under the sanctioned VisualQaRunner
# locally, never concurrently in CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; cancel superseded runs so we never stack Electron-adjacent work.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    # Pushes to main run on the self-hosted Proxmox runners (public-ci runner
    # group, restricted to this repo). Pull requests always use GitHub-hosted
    # runners so fork code never executes on the self-hosted machines. There is
    # no self-hosted macOS runner, so macOS is GitHub-hosted either way.
    runs-on: ${{ github.event_name == 'pull_request' && matrix.hosted || fromJSON(matrix.self_hosted) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu
            hosted: ubuntu-latest
            self_hosted: '["self-hosted", "linux-proxmox"]'
          - os: windows
            hosted: windows-latest
            self_hosted: '["self-hosted", "windows-proxmox"]'
          - os: macos
            hosted: macos-latest
            self_hosted: '"macos-latest"'
    # actions/checkout trusts the workspace (safe.directory) only inside its own
    # temporary HOME, so later git commands fall back to the runner's real
    # config. On the self-hosted Windows runner the persistent workspace is not
    # owned by the runner account, git refuses it as "dubious ownership", and
    # `git diff` then silently degrades to --no-index ("Not a git repository",
    # exit 129) -- issue #113. Trust exactly this workspace, for this job only,
    # as command-scope config: nothing is written to the runner's global config.
    env:
      GIT_CONFIG_COUNT: 1
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate icons
        run: npm run build:icons

      - name: Verify icon generation is deterministic
        # Prove git sees the repository first: outside one, `git diff` reports a
        # usage error that reads like a determinism failure.
        run: |
          git rev-parse --is-inside-work-tree
          git diff --exit-code -- assets/generated/icons
        shell: bash

      - name: Bundle native editor
        run: npm run build:editor

      - name: Tests + syntax/check gate (includes product-posture)
        run: npm run check

      - name: Validate packaging configuration
        shell: bash
        run: node .github/scripts/validate-build-config.js
